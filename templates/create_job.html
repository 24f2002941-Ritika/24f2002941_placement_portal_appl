{% extends "main.html" %}
{% block content %}
<h2>Create Job</h2>
<a href="/company/dashboard"> Back to Dashboard</a>
<div style="padding: 15px;background: rgb(241, 242, 244);box-shadow: 0 4px 10px rgba(0,0,0,0.1);border-radius: 15px;height: fit-content;">
<form method="POST">

Job Title
<input name="title">

<br><br>
Job Description
<textarea name="description"></textarea>

<br><br>
Eligibility
<input name="eligibility">
<br><br>

Salary
<input name="salary">

<br><br>

Application Deadline
<input type="date" name="deadline">

<br><br>

<button type="submit">Create Job</button>

</form>
</div>
{% endblock %}
