<h2>Company Login</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
<ul>
{% for message in messages %}
<li>{{ message }}</li>
{% endfor %}
</ul>
{% endif %}
{% endwith %}

<form method="POST">
Email
<input name="email">

Password
<input type="password" name="password">

<button type="submit">Login</button>
</form>
