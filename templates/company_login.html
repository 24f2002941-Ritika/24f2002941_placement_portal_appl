{% extends "base.html" %}
{% block content %}
<h2>Company Login</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
    <div style="color:rgb(0, 217, 255); margin:10px 0;">
        {{ message }}
    </div>
{% endfor %}.
{% endif %}
{% endwith %}

<form method="POST">
Email
<input name="email">

Password
<input type="password" name="password">

<button type="submit">Login</button>
</form>
{% endblock %}
