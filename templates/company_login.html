<h2>Company Login</h2>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}
    <div style="color:red; margin:10px 0;">
        {{ message }}
    </div>
{% endfor %}.
{% endif %}
{% endwith %}

<form method="POST">
Email
<input name="email">

Password
<input type="password" name="password">

<button type="submit">Login</button>
</form>
