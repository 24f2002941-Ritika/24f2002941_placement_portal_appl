<h2>Placement History</h2>

<a href="/student/dashboard">Back to Dashboard</a>

<table border="1">

<tr>
<th>Company</th>
<th>Job Title</th>
<th>Salary</th>
</tr>

{% for placement in placements %}

<tr>

<td>{{ placement.job.company.name if placement.job else "N/A" }}</td>
<td>{{ placement.job.job_title if placement.job else "N/A" }}</td>
<td>{{ placement.job.salary if placement.job else "N/A" }}</td>

</tr>

{% endfor %}

</table>
