{% extends "base.html" %}
{% block content %}
<h2>Edit Job</h2>

<form method="POST">

<p>Title</p>
<input name="title" value="{{ job.job_title }}">

<p>Description</p>
<input name="description" value="{{ job.job_description }}">

<p>Eligibility</p>
<input name="eligibility" value="{{ job.eligibility }}">

<p>Salary</p>
<input name="salary" value="{{ job.salary }}">

<br><br>

<button type="submit">Update Job</button>

</form>
{% endblock %}
