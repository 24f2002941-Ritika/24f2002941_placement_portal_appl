{% extends "main.html" %}
{% block content %}
<h2>Update Profile</h2>

<form method="POST" enctype="multipart/form-data">

<p>Education</p>
<input name="education" value="{{ student.education }}">

<p>Skills</p>
<input name="skills" value="{{ student.skills }}">

<p>Resume</p>
<input type="file" name="resume">

<br><br>

<button>Update</button>

</form>
{% endblock %}
